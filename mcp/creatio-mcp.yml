source: https://academy.creatio.com/guides/ai-studio/integrations/mcp-integration
status: none
summary: >-
  Creatio does NOT ship an MCP server. Creatio is an MCP CLIENT: Creatio AI
  Studio connects to third-party MCP servers and exposes their tools to Creatio
  AI agents. There is no endpoint an external MCP client can POST to in order to
  call Creatio, and no installable Creatio MCP package on any registry. No
  `type: MCPServer` pointer is emitted in apis.yml, because emitting one would
  credit Creatio with an agent surface it does not serve.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
direction: client
client_capabilities:
  docs: https://academy.creatio.com/guides/ai-studio/integrations/mcp-integration
  description: >-
    "Connect an MCP server to Creatio AI Studio to make its tools available to
    your agents." The operator supplies an MCP Server URL; Creatio discovers all
    tools the server exposes rather than requiring each to be declared.
  credential_types:
    - oauth
    - bearer-token
    - api-key
  access_modes:
    - name: integration-credentials
      description: Shared authentication configured on the integration itself.
    - name: agent-owned-credentials
      description: Each agent authenticates to the MCP server with its own credentials.
    - name: delegated-access
      description: End-user OAuth with a redirect URL; the agent acts on the user's behalf.
  related:
