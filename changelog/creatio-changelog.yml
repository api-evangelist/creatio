scheme: platform-release
scheme_note: >-
  Creatio versions the PLATFORM, not the HTTP surface. Releases carry a
  major.minor.patch number plus a codename that names the generation
  (Atlas -> Quantum -> Energy -> Twin). The OData/DataService endpoints are not
  independently versioned; the OData protocol version (3 vs 4) is selected by
  endpoint path. Release notes are per platform version and Creatio publishes a
  dated release calendar going back to 7.4.0 (2014-10-28).
