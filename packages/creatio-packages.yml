summary: >-
  Creatio publishes one first-party client library on a public registry: the
  Creatio DevKit SDK (@creatio-devkit/common) on npm, used to build Freedom UI
  customizations and integrate them into the Creatio platform. There is no
  first-party Python, Java, Go, Ruby, PHP or Rust client. The two .NET packages
  below (clio, Creatio.Client) are the de-facto developer toolchain for the
  platform but are published from the Advance Technologies Foundation GitHub
  org, not from Creatio, and are not referenced in Creatio's own developer
  documentation — they are recorded as partner/community, not official.
