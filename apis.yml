aid: creatio
name: Creatio
description: >-
  Creatio is a global software vendor of an AI-native no-code platform for
  customer relationship management (CRM) and workflow / business process
  automation. Its product line spans Sales Creatio, Marketing Creatio, and
  Service Creatio, built on Studio Creatio — a no-code toolkit with visual
  designers, AI agents, and a business process engine. Creatio serves banking,
  insurance, manufacturing, high tech, retail, CPG, pharmaceuticals, telecom,
  the public sector, and other industries. For integrations, Creatio exposes
  platform data and processes over an OData 4 service (recommended), a legacy
  OData 3 service, and the RESTful DataService web service, secured with forms
  (cookie) authentication via AuthService.svc or OAuth 2.0 through the Creatio
  Identity Service. Extensions and connectors are distributed through the
  Creatio Marketplace. This profile was enriched by the API Evangelist
  enrichment pipeline from Creatio's public developer documentation.
