x-pointers-deliberately-absent:
  note: >-
    Recorded so a later round does not "helpfully" re-add a pointer that would
    credit Creatio with something it does not publish.
  WellKnown: >-
    Removed 2026-08-13. Every /.well-known/* path on every Creatio host returns
    404, or 403 from the WAF. well-known/creatio-well-known.yml documents an
    absence and must not score as a presence.
  Roadmap: >-
    Removed 2026-08-13. https://www.creatio.com/product/roadmap returns 404 and
    no roadmap page exists in the 1,618-URL site sitemap.
  StatusPage: >-
    Not emitted. status.creatio.com is 404 and creatio.statuspage.io is an
    unclaimed subdomain that 302s to Atlassian's marketing page.
  Deprecation: Not emitted. Creatio publishes no API deprecation policy.
  Security: >-
    Not emitted. No vulnerability disclosure policy, security.txt (403,
    WAF-blocked) or bug bounty program was found.
  MCPServer: >-
    Not emitted. Creatio is an MCP CLIENT — AI Studio connects to third-party
    MCP servers. Creatio ships no MCP server. See mcp/creatio-mcp.yml.
  AgentCard: >-
    Not emitted. /.well-known/agent-card.json and /.well-known/agent.json return
    404 on every host, so no a2a/ artifact was written at all.
  Idempotency: >-
    Not emitted. No idempotency-key contract is documented on any Creatio
    surface. See conventions/creatio-conventions.yml.
  CLI: >-
    Not emitted. clio is published by the Advance Technologies Foundation, not
    Creatio, and is absent from Creatio's own documentation. See
    cli/creatio-cli.yml.
  Postman: >-
    Not emitted. The public "Creatio" Postman workspace is published by
    "Postman Atlas", not Creatio. No first-party workspace exists.
  GitHubOrganization: >-
    Not emitted. github.com/creatio is a personal user account (5 repos, no bio,
    no linked site), not a Creatio organization.
