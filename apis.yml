apis:
- name: Creatio OData API
  description: >-
    OData 4 (recommended) and legacy OData 3 access to Creatio platform
    entities. The OData 4 service is at /0/odata with EDMX metadata at
    /0/odata/$metadata; supports $filter/$select/$expand/$orderby/$top/$skip
    and $batch (up to 100 sub-requests). Multi-tenant: the host is per instance.
  humanURL: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/odata/overview
  baseURL: https://mycreatio.com/0/odata
  x-baseURL-note: >-
    Creatio is multi-tenant; the real base is https://<your-instance>.creatio.com/0/odata.
    mycreatio.com is Creatio's own documentation example host.
  tags:
  - OData
  - CRM
  - Data Access
  properties:
  - type: Documentation
    url: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/odata/overview
- name: Creatio DataService API
  description: >-
    RESTful DataService web service for reading and writing platform records via
    InsertQuery, SelectQuery, UpdateQuery, DeleteQuery, and BatchQuery over HTTP
    POST. Supports JSON/XML/CSV/JSV serialization and row-window pagination.
  humanURL: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/dataservice/overview
  baseURL: https://mycreatio.com/0/dataservice
  x-baseURL-note: >-
    Multi-tenant; real base is https://<your-instance>.creatio.com/0/dataservice.
  tags:
  - REST
  - CRM
  - Data Access
  properties:
  - type: Documentation
    url: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/dataservice/overview
- name: Creatio Business Process Service
  description: >-
    ProcessEngineService.svc runs Creatio business processes from an external
    application over HTTP. Execute() runs a process by schema name, passing
    incoming parameters and returning the execution result; ExecProcElByUId()
    executes a single element of an already-running process. Requires the
    ForceUseSession and BPMCSRF headers alongside the authenticated session.
  humanURL: https://academy.creatio.com/docs/developer/integrations_and_api/business_process_service
  baseURL: https://mycreatio.com/0/ServiceModel/ProcessEngineService.svc
  x-baseURL-note: >-
    Multi-tenant; real base is
    https://<your-instance>.creatio.com/0/ServiceModel/ProcessEngineService.svc.
    mycreatio.com is Creatio's own documentation example host.
  tags:
  - Workflow Automation
  - Business Process Management
  - REST
  properties:
  - type: Documentation
    url: https://academy.creatio.com/docs/developer/integrations_and_api/business_process_service
- name: Creatio Webhook Service
  description: >-
    Inbound webhook receiver. Lets an external app push data into Creatio in
    real time over an authenticated POST, writing a record into a target object
    named by the EntityName parameter. Contact, Lead, Order and Submitted form
    are supported out of the box; more objects can be enabled. Secured with
    OAuth 2.0 — configured automatically on cloud instances, manually on-site.
    Direction is inbound only: Creatio publishes no outbound event catalog.
  humanURL: https://academy.creatio.com/guides/no-code-customization/base-integrations/webhook-service-integration/overview
  baseURL: https://mycreatio.com/
  x-baseURL-note: >-
    Creatio does not publish a fixed webhook path. The URL is generated per
    object and retrieved from the instance UI ("Get the Webhook URL"), so only
    the per-instance host is recordable.
  tags:
  - Webhooks
  - Integration
  - CRM
  properties:
  - type: Documentation
    url: https://academy.creatio.com/guides/no-code-customization/base-integrations/webhook-service-integration/overview
