apis:
- name: Creatio OData API
  description: >-
    OData 4 (recommended) and legacy OData 3 access to Creatio platform
    entities. The OData 4 service is at /0/odata with EDMX metadata at
    /0/odata/$metadata; supports $filter/$select/$expand/$orderby/$top/$skip
    and $batch (up to 100 sub-requests). Multi-tenant: the host is per instance.
  humanURL: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/odata/overview
  baseURL: https://mycreatio.com/0/odata
  x-baseURL-note: >-
    Creatio is multi-tenant; the real base is https://<your-instance>.creatio.com/0/odata.
    mycreatio.com is Creatio's own documentation example host.
  tags:
  - OData
  - CRM
  - Data Access
  properties:
  - type: Documentation
    url: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/odata/overview
- name: Creatio DataService API
  description: >-
    RESTful DataService web service for reading and writing platform records via
    InsertQuery, SelectQuery, UpdateQuery, DeleteQuery, and BatchQuery over HTTP
    POST. Supports JSON/XML/CSV/JSV serialization and row-window pagination.
  humanURL: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/dataservice/overview
  baseURL: https://mycreatio.com/0/dataservice
  x-baseURL-note: >-
    Multi-tenant; real base is https://<your-instance>.creatio.com/0/dataservice.
  tags:
  - REST
  - CRM
  - Data Access
  properties:
  - type: Documentation
    url: https://academy.creatio.com/docs/developer/integrations_and_api/data_services/dataservice/overview
