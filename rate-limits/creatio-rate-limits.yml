summary: >-
  Creatio publishes its API call quota on the PRICING page, not in the developer
  documentation, and it is expressed per user per day rather than per key or per
  window. The developer docs publish payload-shape limits (response rows, batch
  sub-requests, file size) but no request-rate limit, no throttling behaviour,
  and no response headers. An agent cannot read a remaining-quota signal off a
  Creatio response: nothing in the documentation names an X-RateLimit-*,
  RateLimit-* or Retry-After header, or the status code returned on exhaustion.
limit_count: 5
